services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=syncboard
      - POSTGRES_USER=syncboard
      - POSTGRES_PASSWORD=syncboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/001-syncboard.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncboard -d syncboard"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
      - DATABASE_URL=postgres://syncboard:syncboard@postgres:5432/syncboard
    depends_on:
      postgres:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  ollama-model:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:0.5b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  ollama_data: