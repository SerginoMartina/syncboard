services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=syncboard
      - POSTGRES_USER=syncboard
      - POSTGRES_PASSWORD=syncboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/001-syncboard.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncboard -d syncboard"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://syncboard:syncboard@postgres:5432/syncboard
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: